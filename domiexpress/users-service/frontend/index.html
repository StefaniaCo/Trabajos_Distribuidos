<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DomiExpress – Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <main class="card-wrapper">
    <div class="card">

      <div class="card-header">
        <div class="logo">
          <span class="logo-icon">🛵</span>
          <span class="logo-text">DomiExpress</span>
        </div>
        <h1 class="card-title">Crear cuenta</h1>
        <p class="card-subtitle">Únete y recibe tus pedidos más rápido</p>
      </div>

      <form id="registerForm" novalidate>

        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej: María García"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repite tu contraseña"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span class="btn-text">Registrarse</span>
          <span class="btn-loader" hidden>⏳</span>
        </button>

      </form>

      <div id="mensaje" class="mensaje" hidden></div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
